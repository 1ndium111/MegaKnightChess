<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="60%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#2d1519" />
      <stop offset="50%" stop-color="#1c1616" />
      <stop offset="100%" stop-color="#0e0d0c" />
    </radialGradient>

    <radialGradient id="crimsonSpot" cx="72%" cy="48%" r="40%">
      <stop offset="0%" stop-color="#ff4b5c" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#800016" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000" stop-opacity="0" />
    </radialGradient>

    <!-- 3D Ruby Gradients for Mega Knight -->
    <radialGradient id="bRubyMain" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#ff4b5c" />
      <stop offset="25%" stop-color="#d90429" />
      <stop offset="65%" stop-color="#800016" />
      <stop offset="100%" stop-color="#3b000a" />
    </radialGradient>

    <linearGradient id="bShine" x1="0%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#ff8597" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ff4b5c" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="bManeGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff275" />
      <stop offset="40%" stop-color="#ffb703" />
      <stop offset="80%" stop-color="#fb8500" />
      <stop offset="100%" stop-color="#800e13" />
    </linearGradient>

    <linearGradient id="bGoldTrim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff3b0" />
      <stop offset="50%" stop-color="#e09f3e" />
      <stop offset="100%" stop-color="#9e2a2b" />
    </linearGradient>

    <!-- Filters -->
    <filter id="bHeroGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="bEyeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="bShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14" />
      <feOffset dx="0" dy="16" />
      <feComponentTransfer><feFuncA type="linear" slope="0.75"/></feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Obsidian Space -->
  <rect width="1280" height="640" fill="url(#bgGlow)" />
  <rect width="1280" height="640" fill="url(#crimsonSpot)" />

  <!-- Geometric Grid Accent Background -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="160" x2="1280" y2="160" />
    <line x1="0" y1="320" x2="1280" y2="320" />
    <line x1="0" y1="480" x2="1280" y2="480" />
    <line x1="320" y1="0" x2="320" y2="640" />
    <line x1="640" y1="0" x2="640" y2="640" />
    <line x1="960" y1="0" x2="960" y2="640" />
  </g>

  <!-- Isometric Chessboard Base in Perspective (Right Side) -->
  <g transform="translate(680, 240) rotate(-15) skewX(-25) scale(0.95)" opacity="0.45">
    <!-- 8x8 Board Squares -->
    <g>
      <!-- Row 0 -->
      <rect x="0" y="0" width="60" height="60" fill="#ebecd0" />
      <rect x="60" y="0" width="60" height="60" fill="#739552" />
      <rect x="120" y="0" width="60" height="60" fill="#ebecd0" />
      <rect x="180" y="0" width="60" height="60" fill="#739552" />
      <rect x="240" y="0" width="60" height="60" fill="#ebecd0" />
      <rect x="300" y="0" width="60" height="60" fill="#739552" />
      <!-- Row 1 -->
      <rect x="0" y="60" width="60" height="60" fill="#739552" />
      <rect x="60" y="60" width="60" height="60" fill="#ebecd0" />
      <rect x="120" y="60" width="60" height="60" fill="#739552" />
      <rect x="180" y="60" width="60" height="60" fill="#ebecd0" />
      <rect x="240" y="60" width="60" height="60" fill="#739552" />
      <rect x="300" y="60" width="60" height="60" fill="#ebecd0" />
      <!-- Row 2 -->
      <rect x="0" y="120" width="60" height="60" fill="#ebecd0" />
      <rect x="60" y="120" width="60" height="60" fill="#739552" />
      <!-- 2x2 Center Mega Knight Zone (Crimson Glow) -->
      <rect x="120" y="120" width="120" height="120" fill="rgba(217, 4, 41, 0.45)" stroke="#ff4b5c" stroke-width="3" />
      <rect x="240" y="120" width="60" height="60" fill="#ebecd0" />
      <rect x="300" y="120" width="60" height="60" fill="#739552" />
      <!-- Row 3 -->
      <rect x="0" y="180" width="60" height="60" fill="#739552" />
      <rect x="60" y="180" width="60" height="60" fill="#ebecd0" />
      <rect x="240" y="180" width="60" height="60" fill="#739552" />
      <rect x="300" y="180" width="60" height="60" fill="#ebecd0" />
      <!-- Row 4 -->
      <rect x="0" y="240" width="60" height="60" fill="#ebecd0" />
      <rect x="60" y="240" width="60" height="60" fill="#739552" />
      <rect x="120" y="240" width="60" height="60" fill="#ebecd0" />
      <rect x="180" y="240" width="60" height="60" fill="#739552" />
      <rect x="240" y="240" width="60" height="60" fill="#ebecd0" />
      <rect x="300" y="240" width="60" height="60" fill="#739552" />
    </g>
  </g>

  <!-- Left Side: Brand & Hero Typography -->
  <g transform="translate(80, 100)">
    <!-- Category Badge -->
    <g transform="translate(0, 0)">
      <rect width="210" height="32" rx="16" fill="rgba(217, 4, 41, 0.2)" stroke="#ff4b5c" stroke-width="1.2" />
      <text x="16" y="21" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#ff758f" letter-spacing="1.5">VIRAL CHESS VARIANT</text>
      <circle cx="192" cy="16" r="4" fill="#ff4b5c" />
    </g>

    <!-- Main Title -->
    <text x="0" y="110" font-family="'Inter', -apple-system, sans-serif" font-size="64" font-weight="900" fill="#ffffff" letter-spacing="-1">
      MEGA-KNIGHT
    </text>
    <text x="0" y="175" font-family="'Inter', -apple-system, sans-serif" font-size="64" font-weight="900" fill="#ff4b5c" letter-spacing="-1">
      CHESS<tspan fill="#ffe066">.</tspan>
    </text>

    <!-- Subtitle / Hook -->
    <text x="0" y="224" font-family="'Inter', sans-serif" font-size="18" font-weight="500" fill="#c3c1be" letter-spacing="0.2">
      What if chess had a 2×2 Mega Knight that crunches pieces?
    </text>
    <text x="0" y="252" font-family="'Inter', sans-serif" font-size="14" font-weight="400" fill="#8b8987">
      Roll a 6 on the D6 • Travel along vertices • Crush enemy pieces & Kings!
    </text>

    <!-- 4 Feature Badges -->
    <g transform="translate(0, 310)">
      <!-- Badge 1 -->
      <g transform="translate(0, 0)">
        <rect width="180" height="42" rx="8" fill="#21201d" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
        <text x="14" y="26" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#ffffff">🌐 WebRTC 1v1</text>
      </g>
      <!-- Badge 2 -->
      <g transform="translate(195, 0)">
        <rect width="195" height="42" rx="8" fill="#21201d" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
        <text x="14" y="26" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#ffffff">🤖 Smart Bot 2200+</text>
      </g>
      <!-- Badge 3 -->
      <g transform="translate(0, 52)">
        <rect width="180" height="42" rx="8" fill="#21201d" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
        <text x="14" y="26" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#ffffff">📱 Mobile & Desktop</text>
      </g>
      <!-- Badge 4 -->
      <g transform="translate(195, 52)">
        <rect width="195" height="42" rx="8" fill="#21201d" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
        <text x="14" y="26" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#ffffff">⚡ GitHub Pages Ready</text>
      </g>
    </g>

    <!-- Live Link Callout -->
    <g transform="translate(0, 440)">
      <rect width="390" height="46" rx="10" fill="linear-gradient(135deg, #81b64c, #699839)" />
      <text x="24" y="29" font-family="'Inter', sans-serif" font-size="15" font-weight="800" fill="#ffffff">
        ▶ Play Live Online in Browser
      </text>
      <text x="350" y="29" font-family="'Inter', sans-serif" font-size="18" font-weight="800" fill="#ffffff">➔</text>
    </g>
  </g>

  <!-- Right Side: The Towering Hero 3D Mega Knight Illustration -->
  <g transform="translate(860, 80) scale(10.5)" filter="url(#bShadow)">
    <!-- Base Shadow -->
    <ellipse cx="25" cy="46" rx="19" ry="3.5" fill="#000" opacity="0.75" />

    <!-- Exact Chess.com Neo Knight Silhouette in Royal Ruby 3D Finish -->
    <g transform="matrix(.96824974 0 0 .96824974 330.00834 -183.36535)">
      <g transform="translate(.748355 -.374177)">
        <!-- Head & Neck Body -->
        <g transform="matrix(1.084117 0 0 1.084117 27.965887 -17.438385)">
          <path d="m-327.43212 207.28694-4.3739 4.42164c.0915 2.78308.24097 3.56955 1.5674 5.27488 4.1359-2.68691 1.20222 2.64429 4.67029-.077.20054-2.24145 3.17306-2.68139 5.12089-3.63471 7.94975 2.3048.66824 2.52746-3.24438 8.93733-1.12218 1.76912-1.05026 3.88601-1.29949 5.91276l19.55756-.13002v-1.23454l-.71474-1.49442c-1.2489-3.63277.32554-8.49484.15828-14.92228-1.80786-6.26199-4.28669-9.71933-10.41992-9.40673.17372-1.85927-.0103-7.37521-4.35439-1.2228-.6845 4.78941-5.91326.91212-6.66762 7.57584z" 
                fill="url(#bRubyMain)" stroke="#260006" stroke-width="1.3" />

          <!-- Specular Highlight along Snout and Brow -->
          <path d="m-327.43212 207.28694-3.5 3.5 c 0.5 0.5, 2.5 -1.2, 4 -1 c 1.5 0.2, 2.5 1.5, 4 1 c 2 -0.8, 3.5 -2.5, 4.5 -4.5 c -3 -0.5, -6.5 0.2, -9 1z" 
                fill="url(#bShine)" opacity="0.85" />

          <!-- Glowing Golden Eye -->
          <path d="m-321.42982 206.20344c-.40342.63291-2.37309.32339-2.3825-.008-.0413-1.33683 2.88117-1.54992 2.90076-1.29477" 
                fill="#ffe066" filter="url(#bEyeGlow)" stroke="#fff" stroke-width="0.3" />
        </g>

        <!-- Base Pedestal -->
        <path d="m-325.49479 229.18739c-1.32253 0-2.38723.80903-2.38723 1.81396.001 1.80313-.00028 3.70465 0 5.35334h28.19343c-.0001-1.97368 0-3.49579 0-5.35334 0-1.00493-1.06472-1.81396-2.38723-1.81396z" 
              fill="url(#bRubyMain)" stroke="#260006" stroke-linecap="square" stroke-width="1.25" />
        <!-- Gold Trim Lip -->
        <path d="m-325.49479 229.18739 h23.41897 v 1.2 h -23.41897 z" fill="url(#bGoldTrim)" />

        <!-- Mouth & Jaw -->
        <path d="m-329.26454 213.05813c.5563.10473 1.40256-1.13834 1.22498-1.3147-.71394-.71263-2.33937.78481-2.20915.92726" fill="#260006" />
        <path d="m-327.68389 216.9422c.40748-.6395.7247-1.31777 1.62551-1.74538" fill="none" stroke="#260006" stroke-width="1.3" />
      </g>

      <!-- Mane Shading & Golden Ridge -->
      <g fill-rule="evenodd">
        <path d="m-314.92031 200.82395c12.84569 9.7014 8.31787 13.64505 2.77813 27.41745l9.07851.00005-.74413-1.88516c-.99535-3.76757.22946-10.75706.17104-15.87638-1.95249-8.16122-6.21829-10.61512-11.40048-9.72607z" 
              fill="#260006" opacity="0.6" />
        <path d="m-315.94599 196.42814c.42725 1.52104.7417 2.83382.91205 4.31473.46215-1.65516-.0641-5.26851-.91205-4.31473z" 
              fill="url(#bManeGold)" />
      </g>
    </g>
  </g>

  <!-- Glowing 3D D6 Die showing 6 -->
  <g transform="translate(680, 420) rotate(-12)" filter="url(#bHeroGlow)">
    <!-- Die Cube Shadow -->
    <rect x="-35" y="-35" width="90" height="90" rx="18" fill="#111" opacity="0.6" />
    <!-- Die Body (Glossy Red / White) -->
    <rect x="-40" y="-40" width="90" height="90" rx="18" fill="linear-gradient(135deg, #ff4b5c, #d90429)" stroke="#ffe066" stroke-width="2.5" />
    <!-- 6 White Pips -->
    <circle cx="-16" cy="-16" r="7.5" fill="#ffffff" />
    <circle cx="-16" cy="5" r="7.5" fill="#ffffff" />
    <circle cx="-16" cy="26" r="7.5" fill="#ffffff" />
    <circle cx="26" cy="-16" r="7.5" fill="#ffffff" />
    <circle cx="26" cy="5" r="7.5" fill="#ffffff" />
    <circle cx="26" cy="26" r="7.5" fill="#ffffff" />
    <!-- Pip gleam -->
    <circle cx="-18" cy="-18" r="2.5" fill="#ffe066" />
    <circle cx="24" cy="-18" r="2.5" fill="#ffe066" />
  </g>

  <!-- Fiery Embers & Sparks -->
  <g opacity="0.8">
    <circle cx="780" cy="380" r="2.5" fill="#ffe066" filter="url(#bEyeGlow)" />
    <circle cx="820" cy="310" r="1.8" fill="#ff4b5c" />
    <circle cx="750" cy="460" r="3" fill="#fb8500" />
    <circle cx="1120" cy="220" r="2" fill="#ffe066" filter="url(#bEyeGlow)" />
    <circle cx="1160" cy="340" r="2.5" fill="#ff4b5c" />
    <circle cx="1080" cy="480" r="1.5" fill="#ffe066" />
  </g>
</svg>
